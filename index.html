<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Muzz Navbar</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        /* ==============================
           PINK NAVBAR
           ============================== */

        .muzz-category-bar {
            width: 100%;
            height: 112px;

            background: #ff3f6c;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0;
            padding: 0;
        }


        /* ==============================
           NAV ITEMS
           ============================== */

        .muzz-category {
            width: 360px;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            color: white;
            text-decoration: none;

            font-size: 30px;
            font-weight: 400;

            white-space: nowrap;
        }


        /* ==============================
           ICONS
           ============================== */

        .icon {
            width: 34px;
            height: 34px;

            fill: none;
            stroke: white;

            stroke-width: 2.2;

            stroke-linecap: round;
            stroke-linejoin: round;

            flex-shrink: 0;
        }


        /* ==============================
           DIVIDERS
           ============================== */

        .muzz-divider {
            width: 1px;
            height: 46px;

            background: rgba(255, 255, 255, 0.55);

            flex-shrink: 0;
        }


        /* ==============================
           MOBILE
           ============================== */

        @media (max-width: 900px) {

            .muzz-category {
                width: 25vw;
                font-size: 22px;
            }

            .icon {
                width: 28px;
                height: 28px;
            }
        }

    </style>
</head>


<body>


    <div class="muzz-category-bar">

        <!-- RELATIONSHIPS -->

        <a href="#" class="muzz-category">

            <svg class="icon" viewBox="0 0 32 32">

                <path d="
                    M16 27.5
                    C16 27.5 4 20.5 4 11.5
                    C4 7.4 7.1 4.5 11 4.5
                    C13.2 4.5 15.2 5.7 16 7.5
                    C16.8 5.7 18.8 4.5 21 4.5
                    C24.9 4.5 28 7.4 28 11.5
                    C28 20.5 16 27.5 16 27.5Z
                "/>

            </svg>

            <span>Relationships</span>

        </a>


        <div class="muzz-divider"></div>


        <!-- LIFESTYLE -->

        <a href="#" class="muzz-category">

            <svg class="icon" viewBox="0 0 40 40">

                <path d="
                    M10 14
                    H29
                    V25
                    A7 7 0 0 1 22 32
                    H17
                    A7 7 0 0 1 10 25
                    Z
                "/>

                <path d="
                    M29 17
                    H32
                    A5 5 0 0 1 32 27
                    H29
                "/>

                <path d="M14 9 C14 7 17 7 17 4"/>
                <path d="M21 9 C21 7 24 7 24 4"/>

            </svg>

            <span>Lifestyle</span>

        </a>


        <div class="muzz-divider"></div>


        <!-- COMMUNITY -->

        <a href="#" class="muzz-category">

            <svg class="icon" viewBox="0 0 40 40">

                <circle cx="19" cy="18" r="10"/>

                <path d="M19 28 V35"/>

                <path d="M14 35 H24"/>

                <path d="M9 30 C5 28 3 24 3 19"/>

                <path d="M31 19 C31 25 27 29 22 31"/>

            </svg>

            <span>Community</span>

        </a>


        <div class="muzz-divider"></div>


        <!-- MUZZ -->

        <a href="#" class="muzz-category">

            <svg class="icon" viewBox="0 0 40 40">

                <path d="
                    M20 20
                    C17 17 13 12 10 12
                    C7 12 5 14 5 17
                    C5 21 10 24 14 27
                    C17 30 19 33 20 35
                    C21 33 23 30 26 27
                    C30 24 35 21 35 17
                    C35 14 33 12 30 12
                    C27 12 23 17 20 20
                "/>

            </svg>

            <span>Muzz</span>

        </a>

    </div>


</body>
</html>
